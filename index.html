<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#2f6bff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Thu Chi">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png">
<title>Thu Chi Pro</title><style>:root{--bg:#f3f5fa;--card:#fff;--tx:#18202e;--mut:#6b7486;--line:#e6e9f0;--pri:#2f6bff;--pri2:#e8efff;--in:#14a44d;--out:#e5484d;--sav:#8e6cff;--warn:#f59e0b;--r:16px;--sh:0 2px 10px rgba(20,30,60,.06)}
[data-theme=dark]{--bg:#0f131a;--card:#181e28;--tx:#e8ecf3;--mut:#8b95a7;--line:#263042;--pri:#5b8cff;--pri2:#1d2a45;--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:0 12px}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(8px + env(safe-area-inset-top)) 12px 6px;display:flex;align-items:center;gap:8px;max-width:560px;margin:0 auto}
header.top h1{font-size:18px;margin:0;flex:1}
.mbtn{border:0;background:var(--card);color:var(--tx);border-radius:12px;padding:6px 10px;font-size:15px;box-shadow:var(--sh)}
.mon{display:flex;align-items:center;gap:4px;background:var(--card);border-radius:12px;box-shadow:var(--sh);padding:2px}
.mon button{border:0;background:none;color:var(--tx);font-size:18px;padding:4px 10px}
.mon span{font-weight:600;min-width:84px;text-align:center}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin:10px 0;box-shadow:var(--sh)}
.card h3{margin:0 0 10px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.card h3 small{font-weight:400;color:var(--mut)}
.hero{background:linear-gradient(135deg,#2f6bff,#7b5cff);color:#fff}
.hero .big{font-size:30px;font-weight:700;letter-spacing:-.5px}
.hero .lab{opacity:.85;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kpis div{background:rgba(255,255,255,.15);border-radius:12px;padding:8px}
.kpis b{display:block;font-size:15px}
.kpis span{font-size:12px;opacity:.9}
.in{color:var(--in)}.out{color:var(--out)}.sav{color:var(--sav)}.mut{color:var(--mut)}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.ic{width:38px;height:38px;border-radius:12px;background:var(--pri2);display:grid;place-items:center;font-size:19px;flex:none}
.amt{font-weight:600;white-space:nowrap}
.sub{font-size:12.5px;color:var(--mut)}
.bar{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:6px;background:var(--pri)}
.bar i.w{background:var(--warn)}.bar i.d{background:var(--out)}.bar i.g{background:var(--in)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:999px;padding:7px 12px;font-size:13.5px;white-space:nowrap}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.btn{border:0;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:600;background:var(--pri);color:#fff;width:100%}
.btn.sec{background:var(--pri2);color:var(--pri)}
.btn.dan{background:#ffe8e8;color:var(--out)}
.btn.sm{width:auto;padding:7px 12px;font-size:13.5px;border-radius:10px}
.btns{display:flex;gap:8px;margin-top:10px}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:12px;padding:11px 12px;font-size:16px;font-family:inherit}
textarea{min-height:110px}
label{display:block;font-size:12.5px;color:var(--mut);margin:10px 0 4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;color:var(--mut);padding:9px;border-radius:10px;font-weight:600;font-size:14.5px}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:var(--sh)}
.seg button.on.c{color:var(--out)}.seg button.on.t{color:var(--in)}.seg button.on.x{color:var(--sav)}
.amtbox{font-size:30px;font-weight:700;text-align:right;padding:10px 12px}
.ai{font-size:13px;background:var(--pri2);color:var(--pri);border-radius:10px;padding:7px 10px;margin-top:8px}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.catgrid button{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:12px;padding:8px 2px;font-size:11.5px;line-height:1.2}
.catgrid button b{display:block;font-size:20px;margin-bottom:2px}
.catgrid button.on{border-color:var(--pri);background:var(--pri2)}
nav.tab{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
nav.tab button{border:0;background:none;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;flex:1}
nav.tab button b{font-size:20px;font-weight:400}
nav.tab button.on{color:var(--pri)}
nav.tab .add{flex:none;width:56px;height:56px;border-radius:50%;background:var(--pri);color:#fff;font-size:30px;margin-top:-26px;box-shadow:0 6px 18px rgba(47,107,255,.45);justify-content:center}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:50;display:none}
.ov.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);border-radius:22px 22px 0 0;max-height:92vh;overflow:auto;padding:8px 14px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);visibility:hidden;transition:transform .22s ease,visibility .22s;max-width:560px;margin:0 auto}
.sheet.on{transform:none;visibility:visible}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h2{font-size:17px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.x{border:0;background:var(--bg);color:var(--tx);width:32px;height:32px;border-radius:50%;font-size:16px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#18202e;color:#fff;padding:10px 16px;border-radius:12px;z-index:90;font-size:14px;opacity:0;transition:.2s;pointer-events:none;max-width:90%}
.toast.on{opacity:1}
.day{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);margin:14px 4px 0;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:600}
.tscroll{overflow-x:auto}
canvas{width:100%;display:block}
.leg{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.ins{padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.ins:last-child{border:0}
.menu .it{cursor:pointer}
.badge{background:var(--out);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;margin-left:6px}
.empty{text-align:center;color:var(--mut);padding:24px 8px}
.lock{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.lock input{max-width:200px;text-align:center;font-size:26px;letter-spacing:10px}
.pill{display:inline-block;font-size:11.5px;border-radius:999px;padding:1px 8px;background:var(--pri2);color:var(--pri)}

.issue.info{border-color:var(--pri)}
.fab2{display:flex;gap:6px;flex-wrap:wrap}

<body>
<header class="top" id="top"></header>
<main class="wrap" id="main"></main>

</nav>
<div class="ov" id="ov" onclick="closeSheet()"></div><div class="sheet" id="sheet"></div><div class="toast" id="toast"></div>

/* ---------- đọc số tiền kiểu Việt: 100k, 1tr5, 2.5tr, 1,2tr, 20.500.750, 15 (=15k) ---------- */

/* ---------- Gõ nhanh 1 dòng: "đổ xăng 100k hôm qua tiền mặt" ---------- */
function parseQuick(text, opts = {}) {

  const today = opts.today ? new Date(opts.today) : new Date();
  const dateRules = [[/\s(hôm nay|hnay|nay)\s/i, 0], [/\s(hôm qua|hqua|qua)\s/i, -1], [/\s(hôm kia|hkia)\s/i, -2]];

  if (m) { let y = m[3] ? +m[3] : today.getFullYear(); if (y < 100) y += 2000; res.date = `${y}-${pad2(+m[2])}-${pad2(+m[1])}`; t = t.replace(m[0], ' '); }

  for (const [re, w] of wal) if (re.test(t)) { res.wallet = w; t = t.replace(re, ' '); break; }
  if (/\s(\+|thu|nhận)\s/i.test(t)) { res.type = 'Thu'; t = t.replace(/\s(\+|thu)\s/i, ' '); }
  const toks = t.trim().split(/\s+/);
  for (let i = toks.length - 1; i >= 0; i--) {
    const tk = toks[i].replace(/^\+/, '');
    if (/^\d/.test(tk)) { const v = parseAmount(tk, opts.smallIsThousand !== false); if (v > 0) { res.amount = v; toks.splice(i, 1); break; } }
  }
  res.desc = toks.join(' ').replace(/\s+/g, ' ').trim();
  if (res.desc) res.desc = res.desc[0].toUpperCase() + res.desc.slice(1);

}

/* ---------- Phân loại tự động ---------- */

/* ---------- Tổng hợp số liệu ---------- */

/* Ngân sách an toàn hôm nay = (tổng ngân sách còn lại của các danh mục chi linh hoạt) / số ngày còn lại */

/* ---------- Giao dịch định kỳ: phát hiện + đến hạn ---------- */

/* debt: {id,kind:'borrow'|'lend',name,principal,start,due,rate,inst,day,kw,countAsSpend,note,closed}
   Giao dịch gắn debtId. borrow: Thu›Vay tiền (nhận tiền vay), Chi›Trả nợ (trả). lend: Chi›Cho vay (đưa), Thu›Thu nợ (thu về).
   Dòng tiền vay/cho vay/thu nợ KHÔNG tính thu nhập/chi tiêu. Trả nợ tính chi tiêu nếu countAsSpend (mặc định: có – vì món hàng/việc vay để làm chưa được ghi chi). */
const DEBT_SUBS = ['Vay tiền', 'Cho vay', 'Thu nợ', 'Trả nợ - Trả góp', 'Trả lãi vay'];

const icon = c => CAT_ICON[c] || '📁';
const ymLabel = ym => `Th ${+ym.slice(5)}/${ym.slice(0, 4)}`;

/* ---------- khung ---------- */
function go(v, sub) { view = v; ui.sub = sub || null; render(); scrollTo(0, 0); }
function shiftMonth(k) { ui.ym = addMonths(ui.ym, k); render(); }
function render() {
  document.querySelectorAll('nav.tab button[data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  const titles = { home: 'Thu Chi Pro', tx: 'Giao dịch', report: 'Báo cáo', more: 'Tiện ích' };
  const showMonth = ['home', 'tx', 'report'].includes(view) || ui.sub === 'budget';
  $('#top').innerHTML = (ui.sub ? `<button class="mbtn" onclick="go('more')">‹</button>` : '') + `<h1>${esc(ui.sub ? SUBT[ui.sub] : titles[view])}</h1>` + (showMonth ? `<div class="mon"><button onclick="shiftMonth(-1)">‹</button><span onclick="ui.ym=monthOf(todayStr());render()">${ymLabel(ui.ym)}</span><button onclick="shiftMonth(1)">›</button></div>` : '');
  const V = { home: vHome, tx: vTx, report: vReport, more: () => ui.sub ? SUBV[ui.sub]() : vMore() };
  $('#main').innerHTML = V[view]();
  if (view === 'report') drawReportCharts();
}

/* ---------- TRANG CHỦ ---------- */
function vHome() {
  const st = monthStats(db, ui.ym), prev = monthStats(db, addMonths(ui.ym, -1));
  const s2s = safeToSpend(db, ui.ym);
  const due = monthOf(todayStr()) === ui.ym ? dueRecurring(db) : [];
  const bud = budgetFor(db, ui.ym);
  const alerts = Object.keys(bud).filter(c => bud[c] > 0 && (st.byCat[c] || 0) / bud[c] >= 0.8).map(c => ({ c, r: (st.byCat[c] || 0) / bud[c] }));
  let h = `<div class="card hero"><div class="lab">Còn lại tháng này (Thu − Chi − Để dành)</div><div class="big">${fmt(st.net)}đ</div>
  <div class="kpis"><div><span>Thu nhập</span><b>${fmtShort(st.income)}</b></div><div><span>Chi tiêu</span><b>${fmtShort(st.spend)}</b></div><div><span>Để dành</span><b>${fmtShort(st.saving)}</b></div></div>
  <div class="lab" style="margin-top:8px">Giữ lại được ${pct(st.keepRate)} thu nhập · ${st.count} giao dịch</div></div>`;
  if (s2s.total && s2s.daysLeft) h += `<div class="card"><div class="row"><div class="ic">🎯</div><div class="sp"><b>Hôm nay nên tiêu tối đa ${fmt(s2s.perDay)}đ</b><div class="sub">Ngân sách linh hoạt còn ${fmt(s2s.left)}đ / ${s2s.daysLeft} ngày</div></div></div></div>`;
  const lb = db.settings.lastBackup; if (db.tx.length > 20 && (!lb || (Date.now() - new Date(lb)) / 864e5 > 7)) h += `<div class="card"><div class="row"><div class="ic">💾</div><div class="sp"><b>Nên sao lưu dữ liệu</b><div class="sub">${lb ? 'Lần cuối: ' + lb.slice(0, 10) : 'Chưa sao lưu lần nào'}</div></div><button class="btn sm" onclick="exportJSON()">Sao lưu</button></div></div>`;
  if (due.length) h += `<div class="card"><h3>🔔 Khoản định kỳ tháng này <small>${due.length}</small></h3><div class="list">${due.map(r => `<div class="it"><div class="ic">${icon(r.cat)}</div><div class="sp"><div class="ell">${esc(r.desc)}</div><div class="sub">${r.overdue ? '<span class="pill d">Đến hạn</span>' : 'Còn ' + r.dueIn + ' ngày'} · ngày ${r.day}${r.variable ? ' · số tiền thay đổi' : ''}</div></div><div class="amt ${r.type === 'Thu' ? 'in' : 'out'}">${fmtShort(r.amount)}</div><button class="btn sm" onclick="payRec('${r.id}')">✓</button></div>`).join('')}</div></div>`;
  const ds = debtSummary(db), dq = monthOf(todayStr()) === ui.ym ? dueDebts(db) : [];
  if (ds.nOwe + ds.nOwed || dq.length) h += `<div class="card" onclick="go('more','debts')"><h3>💳 Nợ & khoản vay <small>Chi tiết ›</small></h3><div class="g2"><div><div class="sub">Tôi đang nợ</div><b class="out">${fmt(ds.owe)}</b></div><div><div class="sub">Người khác nợ tôi</div><b class="in">${fmt(ds.owed)}</b></div></div>${ds.monthly ? `<div class="sub" style="margin-top:6px">Phải trả góp ~${fmt(ds.monthly)}đ/tháng</div>` : ''}</div>${dq.length ? `<div class="card"><h3>⏰ Sắp đến hạn nợ</h3><div class="list">${dq.map(({ d, s }) => `<div class="it"><div class="ic">${d.kind === 'borrow' ? '📤' : '📥'}</div><div class="sp"><div class="ell">${d.kind === 'borrow' ? 'Trả ' : 'Thu '}${esc(d.name)}</div><div class="sub">${s.daysTo < 0 ? `<span class="pill d">Quá hạn ${-s.daysTo} ngày</span>` : s.daysTo === 0 ? '<span class="pill d">Hôm nay</span>' : 'Còn ' + s.daysTo + ' ngày'} · còn nợ ${fmtShort(s.remaining)}</div></div><b>${fmtShort(Math.min(d.inst || s.remaining, s.remaining))}</b><button class="btn sm" onclick="event.stopPropagation();payDebt('${d.id}')">✓</button></div>`).join('')}</div></div>` : ''}`;
  if (alerts.length) h += `<div class="card"><h3>⚠️ Cảnh báo ngân sách</h3>${alerts.map(a => `<div style="margin:6px 0"><div class="row"><span class="sp">${icon(a.c)} ${esc(a.c)}</span><b class="${a.r > 1 ? 'out' : ''}">${pct(a.r)}</b></div><div class="bar"><i class="${a.r > 1 ? 'd' : 'w'}" style="width:${Math.min(100, a.r * 100)}%"></i></div></div>`).join('')}</div>`;
  const ins = insights(st, prev);

  const fq = frequent(8);
  if (fq.length) h += `<div class="card"><h3>⚡ Ghi nhanh <small>chạm để nhập</small></h3><div class="chips">${fq.map((f, i) => `<button class="chip" onclick="openAdd({quick:FQ[${i}]})">${icon(f.cat)} ${esc(f.desc)} ${fmtShort(f.amount)}</button>`).join('')}</div></div>`;
  const rec = [...st.tx].sort((a, b) => (b.date + (b.ts || '')).localeCompare(a.date + (a.ts || ''))).slice(0, 6);
  h += `<div class="card"><h3>Gần đây <small onclick="go('tx')">Xem tất cả ›</small></h3>${rec.length ? `<div class="list">${rec.map(txRow).join('')}</div>` : `<div class="empty">Chưa có giao dịch tháng này.<br>Bấm <b>＋</b> để thêm, hoặc vào <b>Tiện ích › Dữ liệu</b> để nhập file Excel.</div>`}</div>`;
  return h;
}
let FQ = [];
function frequent(n) {
  const since = addMonths(monthOf(todayStr()), -2) + '-01'; const m = new Map();
  for (const t of db.tx) { if (t.date < since || t.type === 'Chuyển' || /không nhớ/i.test(t.desc)) continue; const k = norm(t.desc) + '|' + t.amount; const o = m.get(k) || { desc: t.desc, amount: t.amount, cat: t.cat, n: 0 }; o.n++; m.set(k, o); }
  FQ = [...m.values()].filter(x => x.n >= 2).sort((a, b) => b.n - a.n).slice(0, n); return FQ;
}
function insights(st, prev) {
  const out = []; if (!st.count) return out;
  const prevs = [1, 2, 3].map(k => monthStats(db, addMonths(ui.ym, -k))).filter(s => s.count && !s.tx.some(t => /^chi tiêu tháng/i.test(t.desc)));
  const avg = prevs.length ? prevs.reduce((s, x) => s + x.spend, 0) / prevs.length : 0;
  const isCur = ui.ym === monthOf(todayStr());
  if (isCur) {
    const d = +todayStr().slice(8), D = daysInMonth(ui.ym); const bud = budgetFor(db, ui.ym); const fixed = new Set(db.settings.fixedCats);
    let varSpent = 0, fixSpent = 0; for (const c in st.byCat) (fixed.has(c) ? fixSpent += st.byCat[c] : varSpent += st.byCat[c]);
    const forecast = fixSpent + varSpent / d * D;
    out.push(`📈 Dự báo chi cả tháng ≈ <b>${fmt(forecast)}đ</b>${avg ? ` · ${forecast > avg ? '🔺 cao' : '🔻 thấp'} hơn TB 3 tháng trước ${pct(Math.abs(forecast / avg - 1))}` : ''}`);
  }
  if (avg && !isCur) { const r = st.spend / avg - 1; out.push(`${r > 0 ? '🔺' : '🔻'} Chi tiêu ${r > 0 ? 'cao' : 'thấp'} hơn trung bình 3 tháng trước <b>${pct(Math.abs(r))}</b> (TB ${fmtShort(avg)})`); }
  let up = null; for (const c in st.byCat) { const dlt = st.byCat[c] - (prev.byCat[c] || 0); if (!up || dlt > up.d) up = { c, d: dlt }; }
  if (up && up.d > 0 && prev.count) out.push(`${icon(up.c)} <b>${esc(up.c)}</b> tăng mạnh nhất: +${fmt(up.d)}đ so với tháng trước`);
  const k = st.byCat['Khác'] || 0; if (st.spend && k / st.spend > 0.2) out.push(`📦 "Khác" chiếm <b>${pct(k / st.spend)}</b> → vào <a href="#" onclick="go('more','data');return false">Dữ liệu › Kiểm tra</a> để tự phân loại lại`);
  if (st.spend && st.notNeed) out.push(`✂️ Chi không cần thiết: <b>${fmt(st.notNeed)}đ</b> (${pct(st.notNeed / st.spend)})`);
  const subs = Object.entries(st.bySub).sort((a, b) => b[1] - a[1])[0]; if (subs) out.push(`🏷️ Tốn nhiều nhất: <b>${esc(subs[0].replace('›', ' › '))}</b> ${fmt(subs[1])}đ`);
  return out.slice(0, 5);
}
const DBN = id => { const d = (db.debts || []).find(x => x.id === id); return d ? d.name : ''; };
function txRow(t) {
  return `<div class="it" onclick="openAdd({id:'${t.id}'})"><div class="ic">${t.type === 'Chuyển' ? '⇄' : icon(t.cat)}</div><div class="sp"><div class="ell">${esc(t.desc)}</div><div class="sub ell">${esc(t.cat + ' › ' + t.sub)}${t.debtId && DBN(t.debtId) ? ' · 💳 ' + esc(DBN(t.debtId)) : ''}${t.need === 'Không cần thiết' ? ' · <span class="pill w">Không CT</span>' : ''}</div></div><div class="amt ${cls(t)}">${sign(t)}${fmt(t.amount)}</div></div>`;
}

/* ---------- GIAO DỊCH ---------- */
function vTx() {
  const q = norm(ui.txq);
  let list = db.tx.filter(t => (ui.txScope === 'all' || monthOf(t.date) === ui.ym) && (!ui.txType || t.type === ui.txType) && (!ui.txCat || t.cat === ui.txCat) && (!q || norm(t.desc + ' ' + t.cat + ' ' + t.sub + ' ' + (t.note || '')).includes(q) || String(t.amount).includes(q)));
  list.sort((a, b) => b.date.localeCompare(a.date) || (b.ts || '').localeCompare(a.ts || ''));
  const tot = list.reduce((s, t) => { if (t.type === 'Thu') s.i += t.amount; else if (t.type === 'Chi') s.o += t.amount; return s; }, { i: 0, o: 0 });
  const cats = [...new Set(db.tx.map(t => t.cat))].filter(Boolean);
  let h = `<div class="card" style="padding:10px"><input placeholder="🔍 Tìm nội dung, danh mục, số tiền…" value="${esc(ui.txq)}" oninput="ui.txq=this.value;clearTimeout(window._q);window._q=setTimeout(()=>{render();const i=document.querySelector('#main input');i.focus();i.setSelectionRange(i.value.length,i.value.length)},250)">
  <div class="chips" style="margin-top:8px"><button class="chip ${ui.txScope === 'all' ? 'on' : ''}" onclick="ui.txScope=ui.txScope==='all'?'month':'all';render()">📅 ${ui.txScope === 'all' ? 'Tất cả tháng' : 'Tháng đang chọn'}</button>
  ${['', 'Chi', 'Thu'].map(x => `<button class="chip ${ui.txType === x ? 'on' : ''}" onclick="ui.txType='${x}';render()">${x || 'Mọi loại'}</button>`).join('')}</div>
  <div class="chips"><button class="chip ${!ui.txCat ? 'on' : ''}" onclick="ui.txCat='';render()">Mọi danh mục</button>${cats.map(c => `<button class="chip ${ui.txCat === c ? 'on' : ''}" onclick="ui.txCat='${esc(c)}';render()">${icon(c)} ${esc(c)}</button>`).join('')}</div>
  <div class="row sub"><span class="sp">${list.length} giao dịch</span><span class="in">+${fmt(tot.i)}</span><span class="out">-${fmt(tot.o)}</span></div></div>`;
  if (!list.length) return h + `<div class="empty">Không có giao dịch phù hợp</div>`;
  let cur = '', buf = [], dayOut = 0; const flush = () => { if (buf.length) h += `<div class="day"><span>${dLabel(cur)}</span><span class="out">${dayOut ? '-' + fmt(dayOut) : ''}</span></div><div class="card list" style="padding:2px 14px;margin-top:6px">${buf.join('')}</div>`; buf = []; dayOut = 0; };
  for (const t of list.slice(0, 400)) { if (t.date !== cur) { flush(); cur = t.date; } buf.push(txRow(t)); if (t.type === 'Chi') dayOut += t.amount; }
  flush(); if (list.length > 400) h += `<div class="empty">Hiển thị 400 giao dịch đầu – dùng bộ lọc để thu hẹp</div>`;
  return h;
}

  const t = o.id ? db.tx.find(x => x.id === o.id) : null;

function goalProgress(g) {

  if (g.mode === 'net') return yearMonths(db, y).reduce((s, m) => { const st = monthStats(db, m); return s + st.income - st.spend; }, 0) + (+g.manual || 0);
  if (g.mode === 'notneed') return db.tx.filter(t => t.date.startsWith(y) && t.type === 'Chi' && t.need === 'Không cần thiết').reduce((s, t) => s + t.amount, 0);
  return +g.manual || 0;
}

function renSub(T, c, s) { const n = prompt(`Đổi tên "${s}" (để trống = xóa nếu chưa dùng):`, s); if (n === null || n === s) return; if (!n) { if (db.tx.some(t => t.cat === c && t.sub === s)) return toast('Đang có giao dịch dùng, không xóa được'); db.cats[T][c] = db.cats[T][c].filter(x => x !== s); } else { db.cats[T][c] = [...new Set(db.cats[T][c].map(x => x === s ? n : x))]; db.tx.forEach(t => { if (t.cat === c && t.sub === s) t.sub = n; }); db.rules.forEach(r => { if (r.cat === c && r.sub === s) r.sub = n; }); } save(); render(); }

const FIXABLE = { tax: 'Chuyển sang Hoàn thuế', recat: 'Phân loại lại tất cả', wrongfood: 'Sửa danh mục', need: 'Tự điền mức độ', wallet: 'Điền "Ngân hàng"', plug: 'Chuyển sang "Không rõ"', carry: 'Xóa dòng chuyển kỳ', dup: 'Giữ nguyên (đánh dấu đã xem)' };
function fixIssue(k, silent) {
  const i = window._ISS[k]; let n = 0;
  if (i.id === 'recat' || i.id === 'wrongfood') i.items.forEach(({ t, s }) => { t.cat = s.cat; t.sub = s.sub; if (!t.need) t.need = s.need; ensureCat(db, 'Chi', s.cat, s.sub); n++; });
  if (i.id === 'need') i.items.forEach(t => { t.need = CL.needFor(t.sub) || 'Cần thiết'; n++; });
  if (i.id === 'tax') i.items.forEach(t => { t.cat = 'Tài chính'; t.sub = 'Hoàn thuế'; delete t.debtId; n++; });
  if (i.id === 'plug') i.items.forEach(t => { t.cat = 'Khác'; t.sub = 'Không rõ'; t.need = ''; n++; });
  if (i.id === 'carry') { const ids = new Set(i.items.map(t => t.id)); db.tx = db.tx.filter(t => !ids.has(t.id)); n = ids.size; }
  if (i.id === 'dup') { db.settings.dupSeen = i.items.length; n = 0; }
  if (!silent) { save(); render(); toast('Đã sửa ' + n + ' giao dịch'); } return n;
}
function fixAll() { if (!confirm('Tự sửa tất cả (phân loại lại, điền mức độ, ví, tách số bù, xóa dòng chuyển kỳ)? Nên sao lưu trước.')) return; let n = 0; window._ISS.forEach((i, k) => { if (FIXABLE[i.id]) n += fixIssue(k, true); }); save(); render(); toast('Đã sửa ' + n + ' mục'); }
async function doImportXlsx(f) {

    const n = mergeTx(db, r.tx, mode);
    if (Object.keys(r.budget).length && !db.tx.some(t => t.src !== 'excel')) { for (const c in r.budget) if (typeof r.budget[c] === 'number' && db.cats.Chi[c]) db.budgets.default[c] = r.budget[c]; }

  } catch (e) { alert('Không đọc được file: ' + e.message + '\nMẹo: mở Excel → Lưu lại dạng .xlsx rồi thử lại.'); }

function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
async function exportJSON() { const name = `ThuChiPro_${todayStr()}.json`, txt = JSON.stringify({ app: 'ThuChiPro', schema: SCHEMA, exportedAt: new Date().toISOString(), data: db }); try { const file = new File([txt], name, { type: 'application/json' }); if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); } else download(name, txt, 'application/json'); } catch (e) { download(name, txt, 'application/json'); } db.settings.lastBackup = new Date().toISOString(); save(); render(); }

async function sha(s) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('tcp:' + s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
async function setPin() { const p = prompt('Nhập mã PIN mới (4–6 số):'); if (!p || !/^\d{4,6}$/.test(p)) return toast('PIN phải 4–6 chữ số'); if (prompt('Nhập lại PIN:') !== p) return toast('Không khớp'); db.settings.pinHash = await sha(p); save(); render(); toast('Đã đặt PIN'); }

function loadSeed(silent) {
  if (typeof SEED === 'undefined') return 0;
  const n = mergeTx(db, SEED.tx.map(t => ({ ...t, id: uid() })), 'merge');
  for (const c in SEED.budget) if (db.cats.Chi[c]) db.budgets.default[c] = SEED.budget[c];
  CL = buildClassifier(db);
  window._ISS = dataQuality(db); window._ISS.forEach((i, k) => { if (FIXABLE[i.id]) fixIssue(k, true); });
  CL = buildClassifier(db);
  window._SUG = detectRecurring(db); window._SUG.forEach((s, i) => addSug(i, true));
  const last = [...db.tx].sort((a, b) => b.date.localeCompare(a.date))[0]; if (last) ui.ym = monthOf(last.date);
  save(); if (!silent) { render(); toast('Đã nạp ' + n + ' giao dịch từ đầu năm'); } return n;
}
function boot() {
  const first = !localStorage.getItem(STORE_KEY);

  if (first && typeof SEED !== 'undefined') { const n = loadSeed(true); setTimeout(() => toast('✅ Đã nạp sẵn ' + n + ' giao dịch từ 01/2026'), 600); } applyTheme(); matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  render();

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });

    <div class="btns">${done ? '' : `<button class="btn sm" onclick="payDebt('${d.id}')">${B ? '✓ Ghi trả nợ' : '✓ Ghi thu nợ'}</button>`}<button class="btn sm sec" onclick="debtHist('${d.id}')">Lịch sử (${s.tx.length})</button></div></div>`;
  };
  const act = all.filter(d => !d.closed && !debtStatus(db, d).done), fin = all.filter(d => !act.includes(d));
  let h = `<div class="card hero"><div class="g2"><div><div class="lab">Tôi đang nợ</div><div class="big" style="font-size:22px">${fmt(ds.owe)}đ</div><div class="lab">${ds.nOwe} khoản${ds.monthly ? ' · ' + fmtShort(ds.monthly) + '/tháng' : ''}</div></div><div><div class="lab">Người khác nợ tôi</div><div class="big" style="font-size:22px">${fmt(ds.owed)}đ</div><div class="lab">${ds.nOwed} khoản</div></div></div></div>
  <div class="btns"><button class="btn" onclick="editDebt(null,'borrow')">＋ Tôi đi vay / trả góp</button><button class="btn sec" onclick="editDebt(null,'lend')">＋ Tôi cho vay</button></div>`;
  if (sug.length) h += `<div class="card"><h3>🤖 Phát hiện từ lịch sử <small>${sug.length}</small></h3><div class="sub">Các giao dịch trả/thu nợ chưa gắn với khoản nào. Bấm ＋ để tạo khoản và tự gắn các giao dịch cũ.</div><div class="list">${sug.map((x, i) => `<div class="it"><div class="ic">${x.kind === 'borrow' ? '📤' : '📥'}</div><div class="sp"><div class="ell">${esc(x.kw)}</div><div class="sub">${x.kind === 'borrow' ? 'Đã trả' : 'Đã thu'} ${fmt(x.paid)}đ · ${x.n} lần · ${x.first.slice(5).split('-').reverse().join('/')}→${x.last.slice(5).split('-').reverse().join('/')}</div></div><button class="btn sm" onclick="fromSug(${i})">＋</button></div>`).join('')}</div></div>`;
  h += act.length ? act.map(card).join('') : `<div class="empty">Chưa có khoản nợ nào đang theo dõi.</div>`;
  if (fin.length) h += `<div class="day"><span>Đã tất toán</span></div>` + fin.map(card).join('');
  h += `<div class="sub" style="padding:6px">💡 Tiền vay nhận về, tiền cho vay và tiền thu nợ <b>không</b> tính vào thu nhập/chi tiêu. Khoản trả nợ mặc định <b>tính là chi tiêu</b> (như trả góp, vay để sửa nhà) – tắt trong từng khoản nếu món đã mua đã được ghi chi riêng.</div>`;
  return h;
}
function fromSug(i) { const x = window._DSUG[i]; editDebt(null, x.kind, { name: /góp/i.test(x.kw) ? x.kw : x.name.charAt(0).toUpperCase() + x.name.slice(1), kw: x.kw, inst: x.n >= 2 ? x.avg : 0, day: x.n >= 2 ? x.day : 0, start: x.first, principal: '' , _paid: x.paid }); }
function editDebt(id, kind, pre) {
  const d = id ? db.debts.find(x => x.id === id) : { id: uid(), kind: kind || 'borrow', name: '', principal: 0, start: todayStr(), due: '', rate: '', inst: 0, day: 0, kw: '', countAsSpend: true, note: '', ...(pre || {}) };
  window._DE = { ...d, isNew: !id, rec: !id && !pre };
  const B = () => window._DE.kind === 'borrow';
  openSheet(`<h2>${id ? 'Sửa khoản' : 'Thêm khoản'} nợ<button class="x" onclick="closeSheet()">✕</button></h2>
  <div class="seg" id="de_seg">${[['borrow', '📤 Tôi đi vay / trả góp'], ['lend', '📥 Tôi cho vay']].map(([v, l]) => `<button class="${d.kind === v ? 'on' : ''}" data-k="${v}" onclick="_DE.kind='${v}';document.querySelectorAll('#de_seg button').forEach(b=>b.classList.toggle('on',b.dataset.k==='${v}'));document.getElementById('de_spend').style.display='${v}'==='borrow'?'':'none';document.getElementById('de_rl').textContent='${v}'==='borrow'?'Ghi nhận khoản tiền vay vừa nhận (không tính thu nhập)':'Ghi nhận khoản tiền vừa đưa cho vay (không tính chi tiêu)'">${l}</button>`).join('')}</div>
  <label>Vay của / cho ai vay (hoặc tên khoản)</label><input id="de_n" value="${esc(d.name)}" placeholder="vd: Chú Chung, Trả góp điện thoại, Vay ngân hàng…">
  <div class="g2"><div><label>Số tiền gốc</label><input id="de_p" inputmode="decimal" value="${d.principal ? fmt(d.principal) : ''}" placeholder="vd: 20tr"></div><div><label>Ngày bắt đầu</label><input id="de_s" type="date" value="${d.start || ''}"></div></div>
  ${pre && pre._paid ? `<div class="ai">Lịch sử: đã ${d.kind === 'borrow' ? 'trả' : 'thu'} ${fmt(pre._paid)}đ. Nhập số gốc ban đầu để app tính số còn lại. Để trống = bằng số đã ${d.kind === 'borrow' ? 'trả' : 'thu'} (đã xong).</div>` : ''}
  <div class="g2"><div><label>Trả góp mỗi tháng</label><input id="de_i" inputmode="decimal" value="${d.inst ? fmt(d.inst) : ''}" placeholder="không bắt buộc"></div><div><label>Ngày trả hằng tháng</label><input id="de_d" type="number" min="1" max="31" value="${d.day || ''}" placeholder="vd: 13"></div></div>
  <div class="g2"><div><label>Hạn trả hết</label><input id="de_due" type="date" value="${d.due || ''}"></div><div><label>Lãi suất %/năm</label><input id="de_r" inputmode="decimal" value="${d.rate || ''}" placeholder="0 = không lãi"></div></div>
  <label>Từ khóa tự gắn giao dịch (cũ & mới)</label><input id="de_k" value="${esc(d.kw || '')}" placeholder="vd: chú Chung, trả góp">
  <label>Ghi chú</label><input id="de_no" value="${esc(d.note || '')}">
  <label id="de_spend" style="display:${d.kind === 'borrow' ? 'flex' : 'none'};gap:8px;align-items:center;font-size:14px;color:var(--tx)"><input type="checkbox" id="de_cs" style="width:auto" ${d.countAsSpend !== false ? 'checked' : ''}> Tính tiền trả nợ là chi tiêu</label>
  ${!id ? `<label style="display:flex;gap:8px;align-items:center;font-size:14px;color:var(--tx)"><input type="checkbox" id="de_rec" style="width:auto" ${pre ? '' : 'checked'}> <span id="de_rl">${d.kind === 'borrow' ? 'Ghi nhận khoản tiền vay vừa nhận (không tính thu nhập)' : 'Ghi nhận khoản tiền vừa đưa cho vay (không tính chi tiêu)'}</span></label>` : ''}
  <div class="btns"><button class="btn" onclick="saveDebt()">Lưu</button>${id ? `<button class="btn sec" onclick="_DE.closed=!_DE.closed;saveDebt()">${d.closed ? 'Mở lại' : 'Đóng khoản'}</button><button class="btn dan" onclick="delDebt('${d.id}')">Xóa</button>` : ''}</div>`);
}
function saveDebt() {
  const E = window._DE, sti = db.settings.smallIsThousand;
  const name = $('#de_n').value.trim(); if (!name) return toast('Nhập tên khoản nợ');
  const linkedPaid = () => db.tx.filter(t => t.debtId === E.id && (t.sub === 'Trả nợ - Trả góp' || t.sub === 'Thu nợ')).reduce((s, t) => s + t.amount, 0);
  const d = { id: E.id, kind: E.kind, name, principal: parseAmount($('#de_p').value, false), start: $('#de_s').value, inst: parseAmount($('#de_i').value, sti), day: Math.min(31, +$('#de_d').value || 0), due: $('#de_due').value, rate: parseFloat(($('#de_r').value || '').replace(',', '.')) || 0, kw: $('#de_k').value.trim(), note: $('#de_no').value, countAsSpend: E.kind === 'borrow' ? $('#de_cs').checked : true, closed: !!E.closed };
  if (d.inst && !d.day) d.day = +((d.start || todayStr()).slice(8));
  db.debts = db.debts || []; const i = db.debts.findIndex(x => x.id === d.id); if (i >= 0) db.debts[i] = d; else db.debts.push(d);
  const n = linkDebtTx(db, d);
  if (!d.principal) d.principal = linkedPaid();
  if (E.isNew && $('#de_rec') && $('#de_rec').checked && d.principal) { const B = d.kind === 'borrow'; db.tx.push({ id: uid(), date: d.start || todayStr(), desc: (B ? 'Vay ' : 'Cho vay ') + name, amount: d.principal, type: B ? 'Thu' : 'Chi', cat: 'Tài chính', sub: B ? 'Vay tiền' : 'Cho vay', need: '', note: '', debtId: d.id, ts: new Date().toISOString() }); }
  if (d.kw) { const k = norm(d.kw); db.recurring = db.recurring.filter(r => !norm(r.desc).includes(k)); }
  save(); closeSheet(); go('more', 'debts'); toast('Đã lưu "' + name + '"' + (n ? ` · gắn ${n} giao dịch cũ` : ''));
}
function delDebt(id) { if (!confirm('Xóa khoản nợ? (Giao dịch đã ghi vẫn giữ, chỉ bỏ liên kết)')) return; db.debts = db.debts.filter(d => d.id !== id); db.tx.forEach(t => { if (t.debtId === id) delete t.debtId; }); save(); closeSheet(); render(); }
function payDebt(id) {
  const d = db.debts.find(x => x.id === id), s = debtStatus(db, d), B = d.kind === 'borrow';
  const amt = Math.min(d.inst || s.remaining, s.remaining) || d.inst;
  openSheet(`<h2>${B ? 'Trả nợ' : 'Thu nợ'}: ${esc(d.name)}<button class="x" onclick="closeSheet()">✕</button></h2><div class="sub">Còn ${B ? 'phải trả' : 'phải thu'}: <b>${fmt(s.remaining)}đ</b></div>
  <label>Số tiền</label><input id="pd_a" class="amtbox" inputmode="decimal" value="${amt ? fmt(amt) : ''}">
  <div class="chips">${[d.inst, s.remaining].filter((v, i, a) => v && a.indexOf(v) === i).map(v => `<button class="chip" onclick="$('#pd_a').value='${fmt(v)}'">${v === s.remaining ? 'Trả hết ' : 'Kỳ này '}${fmtShort(v)}</button>`).join('')}</div>
  ${B ? `<label>Trong đó tiền lãi (không trừ vào gốc)</label><input id="pd_i" inputmode="decimal" placeholder="0" value="${s.estInterestMonth ? fmt(Math.round(s.estInterestMonth / 1000) * 1000) : ''}">` : ''}
  <label>Ngày</label><input id="pd_d" type="date" value="${todayStr()}"><label>Ghi chú</label><input id="pd_n">
  <div class="btns"><button class="btn" onclick="savePay('${id}')">Lưu</button></div>`);
}
function savePay(id) {
  const d = db.debts.find(x => x.id === id), B = d.kind === 'borrow', sti = db.settings.smallIsThousand;
  const a = parseAmount($('#pd_a').value.replace(/\./g, ''), false) || parseAmount($('#pd_a').value, sti); if (!a) return toast('Nhập số tiền');
  const it = B ? parseAmount(($('#pd_i').value || '').replace(/\./g, ''), false) : 0;
  db.tx.push({ id: uid(), date: $('#pd_d').value || todayStr(), desc: B ? (/góp/i.test(d.name) ? d.name : 'Trả nợ ' + d.name) : d.name + ' trả nợ', amount: a, type: B ? 'Chi' : 'Thu', cat: 'Tài chính', sub: B ? 'Trả nợ - Trả góp' : 'Thu nợ', need: B ? 'Cần thiết' : '', note: $('#pd_n').value, debtId: id, interest: it || undefined, ts: new Date().toISOString() });
  save(); closeSheet(); render(); const s = debtStatus(db, d); toast(s.done ? '🎉 Đã tất toán: ' + d.name : `Đã ghi · còn ${fmt(s.remaining)}đ`);
}
function debtHist(id) { const d = db.debts.find(x => x.id === id), s = debtStatus(db, d); openSheet(`<h2>${esc(d.name)}<button class="x" onclick="closeSheet()">✕</button></h2><div class="list">${[...s.tx].reverse().map(txRow).join('') || '<div class="empty">Chưa có giao dịch</div>'}</div>`); }

boot();
</script>
